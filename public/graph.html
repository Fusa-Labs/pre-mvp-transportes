<html lang="es">
<head>

  <title>Grafo Semántico — pre-mvp-transportes</title>
  <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.css">
  <style>

    html, body { width: 100%; height: 100%; overflow: hidden; background: #090D16; color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #network-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-title {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #38BDF8; box-shadow: 0 0 10px #38BDF8; }
    .badge-text { font-size: 12px; font-weight: 700; }
    .badge-count { font-size: 10px; color: #94A3B8; font-weight: 500; }

    .btn-toggle-search {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F1F5F9;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s;
    }
    .btn-toggle-search:active { transform: scale(0.95); }

    .drawer-panel {
      position: absolute;
      top: 60px;
      left: 12px;
      right: 12px;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .drawer-panel.open { display: flex; }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      color: #FFFFFF;
      outline: none;

    .search-input:focus { border-color: #38BDF8; }

    .search-results {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .search-item {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-item:active { background: rgba(56, 189, 248, 0.2); }
    .search-item-label { font-weight: 700; color: #F1F5F9; }
    .search-item-type { font-size: 10px; color: #94A3B8; text-transform: uppercase; }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .legend-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot-ui { width: 7px; height: 7px; border-radius: 50%; background: #2563EB; }
    .dot-srv { width: 7px; height: 7px; border-radius: 50%; background: #059669; }
    .dot-typ { width: 7px; height: 7px; border-radius: 50%; background: #7C3AED; }
    .dot-app { width: 7px; height: 7px; border-radius: 50%; background: #DB2777; }

    .node-sheet {
      position: absolute;
      bottom: 20px;
      left: 14px;
      right: 14px;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 14px;
      z-index: 15;
      box-shadow: 0 16px 35px -5px rgba(0, 0, 0, 0.6);

    .node-sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .node-sheet-title { font-size: 15px; font-weight: 800; color: #FFFFFF; }
    .node-sheet-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; background: rgba(56, 189, 248, 0.15); color: #38BDF8; }
    .node-sheet-file { font-size: 11px; color: #94A3B8; margin-bottom: 8px; font-family: monospace; word-break: break-all; }
    .node-sheet-desc { font-size: 12px; color: #CBD5E1; line-height: 1.4; }

    .controls-panel {
      position: absolute;
      right: 14px;
      bottom: 100px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-ctrl {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.5);
    }
    .btn-ctrl:active { transform: scale(0.92); }

    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #38BDF8;
      font-size: 13px;
      font-weight: 700;
      z-index: 5;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

    var container = document.getElementById("network-container");
    var loading = document.getElementById("loading-indicator");

    try {
      var data = {
        nodes: new vis.DataSet(nodesData),
        edges: new vis.DataSet(edgesData)
      };

      var options = {
        nodes: {
          borderWidth: 2,
          shadow: { enabled: true, color: "rgba(0,0,0,0.5)", size: 6 }
        },
        edges: {
          smooth: { type: "continuous" }
        },
        physics: {
          solver: "forceAtlas2Based",
          forceAtlas2Based: {
            gravitationalConstant: -45,
            centralGravity: 0.015,
            springLength: 85,
            springConstant: 0.09,
            damping: 0.5
          },
          stabilization: {
            enabled: true,
            iterations: 60,
            updateInterval: 10
          }
        },
        interaction: {
          dragNodes: true,
          dragView: true,
          zoomView: true,
          hover: false,
          multiselect: false
        }
      };

      var network = new vis.Network(container, data, options);

      network.once("stabilizationIterationsDone", function() {
        if (loading) loading.style.display = "none";
        network.fit({ animation: { duration: 400 } });
      });

      setTimeout(function() {
        if (loading) loading.style.display = "none";
        network.fit();
      }, 1500);

      network.on("selectNode", function(params) {
        if (!params.nodes || params.nodes.length === 0) return;
        var nodeId = params.nodes[0];
        var node = nodesData.find(function(n) { return n.id === nodeId; });
        if (!node) return;

        document.getElementById("sheet-title").innerText = node.label;
        document.getElementById("sheet-type").innerText = (node.nodeType || "SIMBOLO").toUpperCase();
        document.getElementById("sheet-file").innerText = node.sourceFile;

        var connectedNodeIds = network.getConnectedNodes(nodeId);
        document.getElementById("sheet-desc").innerText = "Conectado directamente con " + connectedNodeIds.length + " elemento(s) del sistema.";
        document.getElementById("node-sheet").style.display = "block";
      });

      network.on("deselectNode", function() {
        document.getElementById("node-sheet").style.display = "none";
      });

    } catch (err) {
      if (loading) {
        loading.innerText = "Error cargando visor: " + err.message;
        loading.style.color = "#EF4444";
      }
    }

    function zoomIn() {
      var scale = network.getScale();
      network.moveTo({ scale: scale * 1.35, animation: { duration: 250 } });
    }

    function zoomOut() {
      var scale = network.getScale();
      network.moveTo({ scale: scale * 0.75, animation: { duration: 250 } });
    }

    function fitGraph() {
      network.fit({ animation: { duration: 400 } });
    }

    function toggleDrawer() {
      var d = document.getElementById("drawer");
      d.classList.toggle("open");
      if (d.classList.contains("open")) {
        document.getElementById("search-input").focus();
        filterNodes("");
      }
    }

    function filterNodes(query) {
      var q = (query || "").trim().toLowerCase();
      var resultsContainer = document.getElementById("search-results");
      resultsContainer.innerHTML = "";

      var filtered = nodesData.filter(function(n) {
        return n.label.toLowerCase().indexOf(q) !== -1 || n.sourceFile.toLowerCase().indexOf(q) !== -1;
      }).slice(0, 8);

      filtered.forEach(function(node) {
        var item = document.createElement("div");
        item.className = "search-item";
        
        var nameSpan = document.createElement("span");
        nameSpan.className = "search-item-label";
        nameSpan.innerText = node.label;
        
        var typeSpan = document.createElement("span");
        typeSpan.className = "search-item-type";
        typeSpan.innerText = node.nodeType;

        item.appendChild(nameSpan);
        item.appendChild(typeSpan);

        item.onclick = function() {
          network.selectNodes([node.id]);
          network.focus(node.id, { scale: 1.4, animation: { duration: 350 } });
          toggleDrawer();

          document.getElementById("sheet-title").innerText = node.label;
          document.getElementById("sheet-type").innerText = (node.nodeType || "SIMBOLO").toUpperCase();
          document.getElementById("sheet-file").innerText = node.sourceFile;
          var connectedNodeIds = network.getConnectedNodes(node.id);
          document.getElementById("sheet-desc").innerText = "Conectado directamente con " + connectedNodeIds.length + " elemento(s) del sistema.";
          document.getElementById("node-sheet").style.display = "block";
        };
        resultsContainer.appendChild(item);
      });
    }
  </script>
